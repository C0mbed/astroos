# AstroOS default configuration
# Override values in config/local.yaml or via ASTROOS__<KEY>__<SUBKEY> env vars

observatory:
  name: "My Observatory"
  latitude_deg: 0.0
  longitude_deg: 0.0
  elevation_m: 0
  timezone: "UTC"

hardware:
  mount:
    driver: indi_mount
    config:
      indi_server: "localhost:7624"
      device_name: ""
  camera:
    driver: indi_camera
    config:
      indi_server: "localhost:7624"
      device_name: ""
  focuser:
    driver: indi_focuser
    config:
      indi_server: "localhost:7624"
      device_name: ""
  filter_wheel:
    driver: indi_filter_wheel
    config:
      indi_server: "localhost:7624"
      device_name: ""
      filters: [L, R, G, B]
  dome:
    enabled: false
    driver: indi_dome
    config:
      indi_server: "localhost:7624"
      device_name: ""

equipment:
  focal_length_mm: 1000
  pixel_size_micron: 3.76
  aperture_mm: 200

pipeline:
  calibration_enabled: true
  plate_solve_enabled: false
  live_stack_enabled: true
  archive_root: "archive"
  quarantine_root: "quarantine"
  calibration_root: "calibration"
  quality_gate:
    fwhm_max_arcsec: 4.5
    eccentricity_max: 0.5
    snr_min: 20.0
    star_count_min: 10
    background_gradient_max: 1.3
    clipping_fraction_max: 0.01
    adaptive: false

plate_solving:
  backend: astap
  astap:
    executable: astap
    index_path: ""
    search_radius_deg: 30
  solve_exposure_s: 5
  solve_binning: "2x2"
  max_pointing_error_arcmin: 1.0
  max_retries: 3

autofocus:
  method: v_curve
  step_size: 50
  num_steps: 9
  binning: "2x2"
  exposure_s: 5
  filter: L
  filter_offsets: {}
  temperature_compensation:
    enabled: false
    coefficient_steps_per_degree_c: 0

safety:
  poll_interval_s: 30
  wind_max_kmh: 40
  humidity_max_pct: 85
  dew_delta_min_c: 3
  resume_after_soft_abort_min: 10

scheduler:
  min_altitude_deg: 25
  max_moon_illumination_pct: 80

api:
  host: "0.0.0.0"
  port: 8080
  keys: []

logging:
  level: INFO
  file: "logs/astroos.log"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
