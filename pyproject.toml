[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astroos"
version = "0.1.0"
description = "Observatory-first astrophotography acquisition platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
pipeline = [
    "sep>=1.4",
    "scipy>=1.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
astroos = "src.cli:main"

[project.entry-points."astroos.drivers.mount"]
# Example: celestron = "astroos_celestron:CelestronMount"

[project.entry-points."astroos.drivers.camera"]
# Example: zwo_asi = "astroos_zwo:ZWOCamera"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
